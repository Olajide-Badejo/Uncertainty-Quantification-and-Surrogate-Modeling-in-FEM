name: CI

# CI has no GPU and must not pretend otherwise (build spec section 18): torch comes from
# the default index as the CPU build everywhere in this file.
on:
  push:
    branches:
      - main
      - "phase/**"
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint (dash, sizes, ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff==0.16.5

      - name: Dash and banned identifier lint
        run: python scripts/dash_lint.py

      - name: File size gate
        run: python scripts/check_file_sizes.py

      - name: Ruff
        run: ruff check src tests scripts

  test-fast:
    name: test-fast (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install the light stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.5.2 scipy==1.18.1 pandas==3.0.5 scikit-learn==1.9.0 pyarrow==25.0.1 pydantic==2.13.5 PyYAML==6.0.3 pytest==9.1.1 hypothesis==6.165.10 pytest-regressions==2.11.0

      - name: Fast tests
        run: pytest tests -m "not slow and not fullstack"

  test-full:
    name: test-full (ubuntu, editable install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install the full stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Full tests
        run: pytest tests -m "not slow"
