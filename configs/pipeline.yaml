# Pipeline settings: grids, thresholds, kernel settings, MC sizes, limit states, paths.
# No distribution or distribution parameter appears here. Those live only in
# configs/probabilistic_model.yaml.

schema_version: 1

# The common displacement grid. Every valid v1 curve spans [0, 20] mm under displacement
# control (U2 = 20t exactly), and the audit verified that 198 of 198 curves interpolate
# onto 201 points with zero NaN.
grid:
  u_min_mm: 0.0
  u_max_mm: 20.0
  n_points: 201

# Global normalizers, so force and displacement enter the reduction on comparable scales.
# Chosen once, here, rather than refit per stage.
normalizers:
  P0_N: 40000.0
  u0_mm: 20.0

# The audit stage of build spec 9.4. Every threshold the validity classification uses lives
# here rather than as a literal in audit.py, and the 198 sample list is never one of them:
# the classification is derived from the ingest artifacts on every run.
audit:
  # A run is valid only if its curve covers the whole common grid, so the span check uses
  # the same [u_min_mm, u_max_mm] the grid block declares. These are tolerances on it.
  u_start_tolerance_mm: 1.0e-6
  u_end_tolerance_mm: 1.0e-6
  # Abaqus step time at the end of a completed analysis, and how close is close enough.
  target_step_time: 1.0
  step_time_tolerance: 0.05
  # Fewer increments than this and the curve is too coarse to carry a QoI at all.
  min_points: 20
  # Displacement is imposed, so |U2| must never decrease along a run. The tolerance absorbs
  # float32 round trips in the extracted CSVs, nothing larger.
  u_monotone_tolerance_mm: 1.0e-9
  # The censoring statistics: how many quantiles the failure rate table splits each input
  # into, and the significance level the report reads the tests at.
  n_quantile_bins: 4
  significance_level: 0.05
  # The completion probability model of build spec 9.4.
  completion_model:
    # Preferred estimator. The logistic fallback is pre authorized by spec 9.4 and is taken
    # only when the GPC fails the guards below, never silently: the choice is recorded in
    # the manifest with the measurement that drove it.
    primary: gaussian_process
    fallback: logistic
    # Matern smoothness of the GPC kernel, matching the surrogate kernel of the kernel block.
    matern_nu: 2.5
    # Wider at the top than the surrogate kernel's bounds on purpose. The features are
    # standardized, so a lengthscale far above the unit scale is the kernel's way of saying
    # an input has no effect, and the bottom cover is exactly that input (chi squared
    # p = 0.30). The fit on the full design settles at about 20 for that dimension, well
    # inside this bound; some cross validation folds push it further, and the stage records
    # the fitted lengthscales in its manifest so the saturation is visible rather than
    # inferred from a warning.
    lengthscale_bounds: [0.05, 1000.0]
    restarts: 4
    # Cross validation of the completion model itself (binding law 3).
    n_folds: 5
    # Bootstrap interval on the cross validated ROC AUC.
    n_bootstrap: 1000
    interval_level: 0.90
    # Bins of the reliability (calibration) table.
    n_calibration_bins: 10
    # A GPC whose cross validated AUC falls below this, or whose predictions collapse to a
    # constant, is rejected in favor of the logistic fallback.
    min_auc: 0.55
    min_prediction_spread: 0.01
    # L2 penalty of the logistic fallback.
    logistic_C: 1.0
  # The validity domain artifact of build spec 9.4.
  validity_domain:
    completion_threshold: 0.5
    # Design density: a query point is inside only if it also sits within the convex hull of
    # the executed design, expanded by this fraction of each input's range. Outside the hull
    # there is no data, whatever the completion model extrapolates.
    hull_expansion: 0.0
    # Resolution of the dense evaluation grid the artifact reports the domain volume on.
    grid_resolution: 21
  # Importance weighting sensitivity study: inverse completion probability weights, clipped
  # so one very unlikely survivor cannot dominate the weighted moments.
  importance_weighting:
    min_probability: 0.05

pca:
  variance_target: 0.99

kernel:
  family: matern
  nu: 2.5
  ard: true
  # Build spec 10.3 justifies the lower bound by the minimum site spacing of the design, and
  # the spec's own suggested 0.05 is below it: the nearest neighbour distance over the 198
  # standardized design points has a minimum of 0.1138 and a fifth percentile of 0.1565. A
  # lengthscale under the closest pair in the design describes correlation the design cannot
  # observe, which is how a kernel ends up interpolating scatter. 0.11 is that measurement
  # rounded down, and a test asserts the relationship rather than the number.
  lengthscale_bounds: [0.11, 10.0]
  restarts: 8

surrogate:
  # The phase block reached 63 components at the 99 percent target of the pca block, which
  # is not a ratio 198 samples support. The GPs are fitted on the phase components needed to
  # reach this share of the phase block variance, capped at this many components; the phase
  # variance the cap leaves behind is carried as reconstruction residual variance rather than
  # being predicted. The decision and what it costs are in docs/DESIGN_DECISIONS.md.
  phase_variance_target: 0.90
  phase_max_components: 8
  # The displacement coordinate along the arc length stations, the fourth block, which is
  # what turns a predicted amplitude back into a curve in the physical plane. It is monotone,
  # so it is represented in the same square root slope tangent space the warps use, and it is
  # capped for the same reason as the phase block.
  displacement_variance_target: 0.90
  displacement_max_components: 10
  # LogNormal hyperprior on the FITTED Gaussian noise variance, in standardized target units.
  # A soft center, never a floor: the noise stays a free parameter of the marginal likelihood
  # and the fit leaves this center by a factor of 25 in both directions across the 45 targets.
  #
  # What this variance means is what fixes the center. It is the nugget: the share of the
  # target's variance the three inputs do not determine, which on a censored campaign with two
  # covers and a strength is substantial. It is NOT the solver's numerical resolution, and
  # centering it there (1e-4) is a specification error this project made and measured its way
  # out of; the evidence is in docs/DESIGN_DECISIONS.md. Targets are standardized to unit
  # variance, so the nugget lives in (0, 1]; a median of 0.1 with a log scale of 1.5 puts a
  # 90 percent prior interval of [0.0085, 1.18] across that whole range, which is weakly
  # informative about everything except exact interpolation.
  noise_prior_median_variance: 0.1
  noise_prior_log_scale: 1.5
  # L-BFGS-B iteration cap per restart. Every fit in this campaign converges well inside it;
  # the cap exists so a pathological target cannot stall the stage.
  optimizer_max_iterations: 200

validation:
  # Grouped folds for anything that needs the registration and the bases refitted inside the
  # fold (build spec 16.3). Ten, because 198 leave one out registrations would cost 43 minutes.
  n_folds: 10
  # The baseline gate of build spec 10.5 is decided on these four quantities of interest.
  headline_qoi:
    - P_max_N
    - u_peak_mm
    - k0_N_per_mm
    - E_abs_Nmm
  # Neighbours of the inverse distance weighted curve baseline of build spec 10.5(d).
  n_neighbors: 3

conformal:
  alphas: [0.1, 0.05]
  K_posterior_draws: 256

# Global sensitivity analysis, build spec section 12. The Q2 publication thresholds are
# deliberately absent: they are the constants build spec 12.1 names and they live in
# src/ufem/sensitivity.py beside the code that applies them, for the same reason the
# calibration gate thresholds do. What is here is only how much computation to spend.
sensitivity:
  # Candidate polynomial chaos basis: total degree 5 under hyperbolic truncation q = 0.75,
  # exactly as build spec 12.1 specifies. At three inputs that is 20 candidate terms, which
  # LARS then selects a sparse subset of; the full degree 5 tensor basis would be 56.
  pce_total_degree: 5
  pce_hyperbolic_q: 0.75
  # Conditional realizations drawn from each Gaussian process posterior for the cross check
  # of build spec 12.2. Every realization gets its own Saltelli estimate, and the reported
  # index is the distribution over these, never the posterior mean's single number.
  gp_realizations: 200
  # Scrambled Sobol design size per realization, as a power of two. Build spec 12.2 asks for
  # 2^15; the measured wall time and the decision are in docs/DESIGN_DECISIONS.md.
  gp_sobol_log2_samples: 15
  # Random Fourier features in the prior path of the pathwise posterior sampler. A joint draw
  # at 163840 design points is not a Cholesky anybody can afford, so the realizations come
  # from the decoupled construction: an approximate prior path plus an exact canonical
  # update. The approximation is in this number and its measured cost is in the manifest.
  gp_fourier_features: 4096
  # Bootstrap resamples inside each SALib Sobol analysis. These give the surrogate Monte
  # Carlo error of one realization's indices, which is not the posterior spread and is
  # labeled as such wherever it appears.
  gp_bootstrap_resamples: 20

mc:
  n_samples: 100000

# Limit states for the reliability stage. Each is a threshold on a QoI the pipeline
# regenerates, never a hand typed result.
limit_states:
  peak_load_below_N: 31000.0     # placeholder characteristic value, 5th percentile logic, refit at P7
  residual_ratio_below: 0.5
  damage_at_10mm_above: 0.93

# One root SeedSequence per run. This entropy is an arbitrary large integer recorded here
# so the whole spawned tree is reproducible; every stage manifest logs it back.
seed_entropy: 866105494284971936421390281

paths:
  raw_data: legacy_salvage/data
  artifact_root: experiments/results
